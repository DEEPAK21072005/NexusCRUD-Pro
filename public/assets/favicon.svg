<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <!-- Circuit Nodes -->
  <circle cx="50" cy="18" r="3" fill="#06b6d4" opacity="0.8" />
  <circle cx="22" cy="70" r="3" fill="#6366f1" opacity="0.8" />
  <circle cx="78" cy="70" r="3" fill="#a855f7" opacity="0.8" />
  <!-- Hexagonal Nexus Core -->
  <polygon points="50,22 78,38 78,70 50,86 22,70 22,38" fill="none" stroke="url(#glowGrad)" stroke-width="3.5" filter="url(#neon)" />
  <!-- Inner Isometric Lines -->
  <line x1="50" y1="22" x2="50" y2="54" stroke="url(#glowGrad)" stroke-width="2.5" />
  <line x1="22" y1="38" x2="50" y2="54" stroke="url(#glowGrad)" stroke-width="2.5" />
  <line x1="78" y1="38" x2="50" y2="54" stroke="url(#glowGrad)" stroke-width="2.5" />
  <line x1="50" y1="54" x2="50" y2="86" stroke="url(#glowGrad)" stroke-width="2.5" />
  <line x1="50" y1="54" x2="22" y2="70" stroke="url(#glowGrad)" stroke-width="2.5" />
  <line x1="50" y1="54" x2="78" y2="70" stroke="url(#glowGrad)" stroke-width="2.5" />
  <!-- Center Glowing Core Node -->
  <circle cx="50" cy="54" r="5" fill="#38bdf8" filter="url(#neon)" />
</svg>